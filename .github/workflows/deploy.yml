name: Deploy to Github Pages

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    # Pinned so the ubuntu-latest image migration cannot change the build silently.
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci
        
      - name: Build project
        run: npm run build
        
      - name: Add .nojekyll file
        run: touch ./out/.nojekyll
        
      - name: Deploy to Github Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: out
          token: ${{ secrets.GITHUB_TOKEN }} 